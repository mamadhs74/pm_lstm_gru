[project]
name = "pm_lstm_gru"
version = "0.1.0"
description = "Leak-proof LSTM/GRU pipeline for real-time PM forecasting"
authors = ["You <you@example.com>"]
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64"]

[tasks]
train = "python -m src.train --config ./src/config.py"
tensorboard = "tensorboard --logdir runs --port 6006"
train_stream = "python -m src.train_stream --config ./src/config.py"
report = "python -m src.report_plots"
report2 = "python -m src.report2"
report_more = "python -m src.report_more"
evaluate    = "python -m src.evaluate"
scenarios = "python -m src.scenarios"
report_advanced = "python -m src.report_advanced_plots"



[dependencies]
python = ">=3.10,<3.13"
pytorch = "*"
torchvision = "*"
scikit-learn = "*"
pandas = "*"
numpy = "*"
matplotlib = "*"
pyyaml = "*"
rich = "*"
tensorboard = "*"
captum = "*"
pyarrow = ">=21.0.0,<22"
statsmodels = ">=0.14.5,<0.15"
